[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-axon"
version = "0.4.32"
description = "Axon — 单用户 CLI Agent Harness：沙箱工具网关、双模型接入、可续跑与项目记忆"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.7",
    "send2trash>=1.8",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "codebuddy-agent-sdk>=0.3.274",
]

[project.urls]
Homepage = "https://github.com/gufengaoyue/axon"
Repository = "https://github.com/gufengaoyue/axon"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
axon = "axon.cli:main"

[tool.setuptools.packages.find]
include = ["axon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
